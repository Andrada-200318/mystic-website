<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Pearl</title>
<style>
.ring{transform-box:view-box;transform-origin:100px 100px;animation:turn 90s linear infinite}
.aura{animation:breathe 7s ease-in-out infinite}
.tw{animation:tw 3.6s ease-in-out infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.68}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="aura"><stop offset="0" stop-color="#f7c9dd" stop-opacity="0.62"/><stop offset="0.55" stop-color="#f7c9dd" stop-opacity="0.2"/><stop offset="1" stop-color="#f7c9dd" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx="0.3" cy="0.22" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.26"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0" stop-color="#f3dfa6"/><stop offset="0.55" stop-color="#d6b36a"/><stop offset="1" stop-color="#a47e36"/></linearGradient>
<radialGradient id="pearl" cx="0.38" cy="0.32" r="0.78"><stop offset="0" stop-color="#fffdf7"/><stop offset="0.42" stop-color="#fbeff2"/><stop offset="0.74" stop-color="#ecd3e2"/><stop offset="1" stop-color="#a98ab8"/></radialGradient>
<linearGradient id="orient" x1="0" y1="0.1" x2="1" y2="0.9"><stop offset="0" stop-color="#ff9fd0" stop-opacity="0.34"/><stop offset="0.36" stop-color="#ffe9a8" stop-opacity="0.12"/><stop offset="0.64" stop-color="#8fe9d6" stop-opacity="0.24"/><stop offset="1" stop-color="#94a8ff" stop-opacity="0.42"/></linearGradient>
<radialGradient id="rim" cx="0.46" cy="0.44" r="0.56"><stop offset="0.74" stop-color="#5b3a7a" stop-opacity="0"/><stop offset="1" stop-color="#5b3a7a" stop-opacity="0.5"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<circle class="aura" style="animation-delay:-4.5s" cx="100" cy="100" r="99" fill="url(#aura)"/>
<circle class="ring" cx="100" cy="100" r="92" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.1 7"/>
<circle cx="146" cy="144" r="17" fill="url(#pearl)"/>
<circle cx="146" cy="144" r="17" fill="url(#orient)"/>
<circle cx="146" cy="144" r="17" fill="url(#rim)"/>
<ellipse cx="140.2" cy="137.2" rx="5.1" ry="3.4" transform="rotate(-32 140.2 137.2)" fill="#fff" fill-opacity="0.9" filter="url(#soft)"/>
<ellipse cx="153.1" cy="152.5" rx="5.8" ry="2.4" transform="rotate(-38 153.1 152.5)" fill="#ffe3f1" fill-opacity="0.55" filter="url(#soft)"/><circle cx="52" cy="137" r="12.5" fill="url(#pearl)"/>
<circle cx="52" cy="137" r="12.5" fill="url(#orient)"/>
<circle cx="52" cy="137" r="12.5" fill="url(#rim)"/>
<ellipse cx="47.8" cy="132" rx="3.8" ry="2.5" transform="rotate(-32 47.8 132)" fill="#fff" fill-opacity="0.9" filter="url(#soft)"/>
<ellipse cx="57.3" cy="143.3" rx="4.3" ry="1.8" transform="rotate(-38 57.3 143.3)" fill="#ffe3f1" fill-opacity="0.55" filter="url(#soft)"/><circle cx="96" cy="92" r="53" fill="url(#pearl)"/>
<circle cx="96" cy="92" r="53" fill="url(#orient)"/>
<circle cx="96" cy="92" r="53" fill="url(#rim)"/>
<ellipse cx="78" cy="70.8" rx="15.9" ry="10.6" transform="rotate(-32 78 70.8)" fill="#fff" fill-opacity="0.9" filter="url(#soft)"/>
<ellipse cx="118.3" cy="118.5" rx="18" ry="7.4" transform="rotate(-38 118.3 118.5)" fill="#ffe3f1" fill-opacity="0.55" filter="url(#soft)"/>
<path class="tw" style="animation-delay:0s" transform="translate(72 62) scale(0.9)" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z" fill="#fff"/><path class="tw" style="animation-delay:-1.3s" transform="translate(134 130) scale(0.42)" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z" fill="#fff"/>
<path class="tw" style="animation-delay:-2.5s" transform="translate(174 22) scale(1)" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z" fill="url(#gold)"/>
<path class="tw" style="animation-delay:-4.3s" transform="translate(22 178) scale(.66)" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z" fill="url(#gold)"/>
</svg>
