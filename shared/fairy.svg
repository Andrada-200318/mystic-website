<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Golden forest fairy</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .wing { transform-box: view-box; transform-origin: 60px 47px; animation: flutter 2.6s ease-in-out infinite; }
    .hover { animation: hover 4s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes flutter { 50% { transform: scaleX(0.88); } }
    @keyframes hover { 50% { transform: translateY(-1.6px); } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
    <!-- One side of the wings; the other side is its mirror image -->
    <g id="wings">
      <path d="M61 45C68 32 82 20 93 23C100 26 97 38 87 43C78 48 68 48 61 47Z"/>
      <path d="M61 46Q75 36 90 27" stroke-dasharray="1 2.5"/>
      <path d="M61 47Q74 43 89 37" stroke-dasharray="1 2.5"/>
      <path d="M61 49C70 50 83 54 86 61C88 68 80 72 74 68C68 64 63 56 61 51Z"/>
      <path d="M62 50Q72 56 80 65" stroke-dasharray="1 2.5"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- Two forest mushrooms under her -->
    <path d="M31 96Q40 83 49 96Z"/>
    <path d="M37 96Q38 100 36 104H44Q42 100 43 96"/>
    <circle cx="37" cy="92" r="0.9"/><circle cx="43" cy="90.5" r="0.9"/>
    <path d="M75 98Q81 89 87 98Z"/>
    <path d="M79 98Q80 101 78 104H84Q82 101 83 98"/>

    <g class="hover">
      <g class="wing">
        <use href="#wings"/>
        <use href="#wings" transform="translate(120 0) scale(-1 1)"/>
      </g>

      <!-- Hair in a bun, face, and a dress of pointed petals, filled so the wings pass behind her -->
      <circle cx="60" cy="26" r="2.6"/>
      <g fill="#12051c">
        <path d="M57.8 39H62.2V43H57.8Z"/>
        <circle cx="60" cy="34" r="6"/>
        <path d="M57.5 53C53 60 49 67 46 75Q50 72 53 77Q56.5 72.5 60 78Q63.5 72.5 67 77Q70 72 74 75C71 67 67 60 62.5 53Z"/>
        <path d="M56 42.5Q60 45 64 42.5L62.5 53H57.5Z"/>
      </g>
      <path d="M54.3 32.5Q58 31 60 28.2Q62 31 65.7 32.5"/>

      <!-- Legs, crossed lightly at the ankle -->
      <path d="M56.5 76.5L58 90L55.5 95"/>
      <path d="M63.5 76.5L62 89L65 94"/>

      <!-- One arm raised with the wand, the other curved at her side -->
      <path d="M63.6 43Q70.5 38 71 28"/>
      <path d="M71 28L74 19"/>
      <path d="M56.4 43Q50 46 49.5 54"/>
    </g>
  </g>

  <g fill="url(#gold)">
    <use class="hover twinkle" href="#spark" transform="translate(75 15) scale(0.5)"/>
    <use class="twinkle" style="animation-delay:-0.8s" href="#spark" transform="translate(86 13) scale(0.2)"/>
    <use class="twinkle" style="animation-delay:-1.6s" href="#spark" transform="translate(97 52) scale(0.24)"/>
    <use class="twinkle" style="animation-delay:-2.6s" href="#spark" transform="translate(22 52) scale(0.24)"/>
    <use class="twinkle" style="animation-delay:-1.2s" href="#spark" transform="translate(106 10) scale(0.6)"/>
    <use class="twinkle" style="animation-delay:-2.4s" href="#spark" transform="translate(12 108) scale(0.4)"/>
  </g>
</svg>
