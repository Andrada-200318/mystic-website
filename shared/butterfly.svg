<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>A golden butterfly rising from a candle flame towards the moon</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .hover { animation: hover 4.4s ease-in-out infinite; }
    .wing-r { transform-box: fill-box; transform-origin: left center; animation: flap 1.6s ease-in-out infinite; }
    .wing-l { transform-box: fill-box; transform-origin: right center; animation: flap 1.6s ease-in-out infinite; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flicker 2.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes hover { 50% { transform: translateY(-2.5px); } }
    @keyframes flap { 50% { transform: scaleX(0.55); } }
    @keyframes flicker { 50% { transform: scale(0.9, 1.08); } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
    <!-- One pair of wings (the right-hand side), drawn from the body at 0,0 -->
    <g id="wing">
      <path d="M1 -3C7 -22 29 -26 28 -10C27 -2 15 0 1 0Z" fill="#12051c"/>
      <path d="M1 1C13 2 24 8 20 18C16 25 6 20 1 6Z" fill="#12051c"/>
      <path d="M5 -4C10 -14 21 -18 23 -11" stroke-dasharray="1 2"/>
      <path d="M5 4C10 6 16 10 15 15" stroke-dasharray="1 2"/>
      <circle cx="19" cy="-13" r="2"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- The crescent moon the soul is flying towards -->
    <path d="M28 18A10 10 0 0 0 28 38A12.5 12.5 0 0 1 28 18Z"/>

    <!-- The candle lit for the soul, and the faint trail the butterfly leaves rising from its flame -->
    <path d="M55 95H65V110H55Z"/>
    <path d="M52 110H68"/>
    <path class="flame" d="M60 81Q65 87 60 93Q55 87 60 81Z"/>
    <path d="M60 79Q53 74 58 70" stroke-dasharray="1 2.5"/>

    <!-- The butterfly, wings beating slowly -->
    <g transform="translate(60 48)">
      <g class="hover">
        <g class="wing-r"><use href="#wing"/></g>
        <g class="wing-l"><use href="#wing" transform="scale(-1 1)"/></g>
        <path d="M0 -12Q2 0 0 13Q-2 0 0 -12Z" fill="#12051c"/>
        <circle cx="0" cy="-14.5" r="2.2"/>
        <path d="M-1 -16.5Q-4 -24 -8 -26M1 -16.5Q4 -24 8 -26"/>
      </g>
    </g>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" style="animation-delay:-0.8s" href="#spark" transform="translate(92 22) scale(0.35)"/>
    <use class="twinkle" style="animation-delay:-2.1s" href="#spark" transform="translate(98 84) scale(0.28)"/>
    <use class="twinkle" style="animation-delay:-1.4s" href="#spark" transform="translate(22 76) scale(0.3)"/>
    <use class="twinkle" href="#spark" transform="translate(46 26) scale(0.22)"/>
  </g>
</svg>
