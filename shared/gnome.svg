<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Golden garden gnome lifting a glowing lantern</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .hover { animation: hover 4.2s ease-in-out infinite; }
    .glow { animation: glow 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes hover { 50% { transform: translateY(-1.4px); } }
    @keyframes glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- A spotted toadstool, a little mushroom and the garden soil between them -->
    <path d="M10 74Q24 54 38 74Q24 70 10 74Z"/>
    <path d="M20 73Q19 84 18 97 M28 73Q29 84 30 97"/>
    <circle cx="20" cy="66.5" r="1.5"/>
    <circle cx="28.5" cy="64" r="1.2"/>
    <path d="M92 86Q99 77 106 86Q99 84 92 86Z"/>
    <path d="M97 86V97 M101 86V97"/>
    <path d="M14 100Q60 96 106 100" stroke-dasharray="1 3"/>

    <g class="hover">
      <!-- A round little tunic and two boots, filled so the garden passes behind them -->
      <g fill="#12051c">
        <path d="M48 62Q46 80 44 94H76Q74 80 72 62Q60 56 48 62Z"/>
        <path d="M44 94Q42 99.5 49 99.5H58V94Z"/>
        <path d="M76 94Q78 99.5 71 99.5H62V94Z"/>
      </g>
      <path d="M46.6 81Q60 84 73.4 81"/>
      <path d="M57.5 80.5H62.5V84.5H57.5Z"/>

      <!-- One hand resting on his belly -->
      <path d="M48.5 64Q41 72 51 77"/>

      <!-- A long beard, the round nose above it and two smiling eyes -->
      <g fill="#12051c">
        <path d="M49 50Q47 62 52 72Q56 79 60 85Q64 79 68 72Q73 62 71 50Q60 56 49 50Z"/>
        <circle cx="60" cy="52.5" r="3.6"/>
      </g>
      <path d="M56 59Q57 69 60 77 M64 59Q63 69 60 77" stroke-dasharray="1 2.5"/>
      <path d="M53.8 48.6Q55.5 47.4 57.2 48.6"/>
      <path d="M62.8 48.6Q64.5 47.4 66.2 48.6"/>

      <!-- His tall pointed hat, its tip flopping towards the stars -->
      <path fill="#12051c" d="M46 46Q50 30 58 20Q64 13 72 12Q66 18 66 26Q68 36 74 46Q60 50 46 46Z"/>
      <path d="M45 46Q60 51 75 46"/>

      <!-- The other arm lifting a lantern -->
      <path d="M71.5 64Q80 66 84 57"/>
      <path d="M84 57V59"/>
      <path d="M80 59H88L86.5 61H81.5Z"/>
      <path d="M81.2 61H86.8V70H81.2Z"/>
      <path d="M80 70.5H88"/>
      <path d="M84 63V68" stroke-dasharray="1 1.6"/>

      <!-- Its light, pulsing out over the toadstools -->
      <g class="glow">
        <path d="M90.5 59.5L93 57"/>
        <path d="M90.5 71L93 73.5"/>
        <path d="M91.5 65.2H95"/>
        <path d="M84 74V76.5"/>
      </g>
    </g>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" style="animation-delay:-0.8s" href="#spark" transform="translate(92 30) scale(0.26)"/>
    <use class="twinkle" style="animation-delay:-1.6s" href="#spark" transform="translate(36 26) scale(0.3)"/>
    <use class="twinkle" style="animation-delay:-2.6s" href="#spark" transform="translate(100 46) scale(0.2)"/>
    <use class="twinkle" style="animation-delay:-1.2s" href="#spark" transform="translate(106 104) scale(0.45)"/>
    <use class="twinkle" style="animation-delay:-2.4s" href="#spark" transform="translate(16 46) scale(0.4)"/>
  </g>
</svg>
