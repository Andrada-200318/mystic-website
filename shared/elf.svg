<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Golden woodland elf raising a glowing crystal</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .hover { animation: hover 4.2s ease-in-out infinite; }
    .glow { animation: glow 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes hover { 50% { transform: translateY(-1.4px); } }
    @keyframes glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- Two pines of the old forest and the mossy ground between them -->
    <path d="M24 40L14 62H19.5L11 82H37L28.5 62H34Z"/>
    <path d="M24 82V98"/>
    <path d="M96 48L88.5 65H93L86.5 82H105.5L99 65H103.5Z"/>
    <path d="M96 82V97"/>
    <path d="M18 103Q60 97 102 103" stroke-dasharray="1 3"/>

    <g class="hover">
      <!-- A long hooded robe, filled so the trees and ground pass behind it -->
      <g fill="#12051c">
        <path d="M56 42Q60 44 64 42L70 47C71 63 74 83 78 97Q60 101 42 97C46 83 49 63 50 47Z"/>
        <path d="M58 37H62V43H58Z"/>
      </g>
      <path d="M51.5 60Q60 63 68.5 60"/>
      <path d="M60 63V96" stroke-dasharray="1 2.5"/>

      <!-- Long hair falling over the shoulders -->
      <path d="M55 27Q51.5 36 53 47"/>
      <path d="M65 27Q68.5 36 67 47"/>

      <!-- Pointed ears, then the face over them, with a jewelled circlet -->
      <g fill="#12051c">
        <path d="M54.6 30.5L46 24.5Q48.5 31 54.9 35Z"/>
        <path d="M65.4 30.5L74 24.5Q71.5 31 65.1 35Z"/>
        <circle cx="60" cy="32" r="6"/>
      </g>
      <path d="M54.4 29.6Q60 27 65.6 29.6"/>
      <path d="M60 26L61 27.6L60 29.2L59 27.6Z"/>
      <path d="M57 33Q58 33.8 59 33"/>
      <path d="M61 33Q62 33.8 63 33"/>

      <!-- One arm resting at her side, the other lifting a crystal point to the stars -->
      <path d="M51 47Q45.5 57 48 68"/>
      <path d="M69 47Q76.5 43 78.5 32"/>
      <path d="M76 31V22L78.5 16.5L81 22V31Z"/>
      <path d="M78.5 16.5V31" stroke-dasharray="1 2"/>

      <!-- Its light, pulsing out into the woods -->
      <g class="glow">
        <path d="M84 14.5L86.5 12"/>
        <path d="M73 14.5L70.5 12"/>
        <path d="M84.5 22H88"/>
        <path d="M72.5 22H69"/>
        <path d="M78.5 11.5V9"/>
      </g>
    </g>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" style="animation-delay:-0.8s" href="#spark" transform="translate(92 30) scale(0.26)"/>
    <use class="twinkle" style="animation-delay:-1.6s" href="#spark" transform="translate(40 18) scale(0.3)"/>
    <use class="twinkle" style="animation-delay:-2.6s" href="#spark" transform="translate(42 58) scale(0.2)"/>
    <use class="twinkle" style="animation-delay:-1.2s" href="#spark" transform="translate(106 92) scale(0.45)"/>
    <use class="twinkle" style="animation-delay:-2.4s" href="#spark" transform="translate(12 104) scale(0.4)"/>
  </g>
</svg>
