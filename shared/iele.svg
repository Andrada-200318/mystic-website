<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Three golden Iele dancing the hora in a moonlit fairy ring</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .sway { transform-box: view-box; transform-origin: 60px 96px; animation: sway 3.4s ease-in-out infinite; }
    .hover { animation: hover 4.4s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes hover { 50% { transform: translateY(-1.4px); } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
    <!-- One dancing maiden, her bare feet at 0,0: loose hair streaming behind her,
         a swirling white dress filled so the others pass behind her, and arms held out for the hora -->
    <g id="maiden">
      <g fill="#12051c">
        <path d="M-4 -28Q-10 -14 -16 -4Q-10 -6 -6 -2Q-2 -6 2 -1Q6 -5 10 -2Q14 -6 17 -5Q10 -16 4 -28Z"/>
        <path d="M-3 -39H3L4 -28H-4Z"/>
        <circle cx="0" cy="-44" r="4.5"/>
      </g>
      <path d="M-3.5 -47Q2 -51 5 -45Q8 -38 12 -33"/>
      <path d="M4.5 -42Q7 -35 10 -31" stroke-dasharray="1 2"/>
      <path d="M-16 -4Q-10 -6 -6 -2Q-2 -6 2 -1Q6 -5 10 -2Q14 -6 17 -5" stroke-dasharray="1 2.2"/>
      <path d="M-3 -37Q-9 -33 -14 -30"/>
      <path d="M3 -37Q9 -33 14 -30"/>
      <path d="M-3 -2L-4 4M3 -1L5 4"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- The crescent moon they dance beneath -->
    <path d="M30 18A10 10 0 0 0 30 38A12.5 12.5 0 0 1 30 18Z"/>

    <!-- The fairy ring their feet leave in the grass, where nothing grows again -->
    <ellipse cx="60" cy="97" rx="38" ry="6.5" stroke-dasharray="1 3"/>
    <path d="M18 104Q22 98 26 104M94 104Q98 98 102 104M34 108Q37 103 40 108M80 108Q83 103 86 108"/>

    <g class="sway">
      <g class="hover">
        <use href="#maiden" transform="translate(37 87) scale(0.85)"/>
        <use href="#maiden" transform="translate(83 87) scale(0.85)"/>
        <use href="#maiden" transform="translate(60 93)"/>
      </g>
    </g>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" style="animation-delay:-0.8s" href="#spark" transform="translate(48 22) scale(0.3)"/>
    <use class="twinkle" style="animation-delay:-1.6s" href="#spark" transform="translate(88 24) scale(0.45)"/>
    <use class="twinkle" style="animation-delay:-2.6s" href="#spark" transform="translate(102 46) scale(0.24)"/>
    <use class="twinkle" style="animation-delay:-1.2s" href="#spark" transform="translate(16 56) scale(0.3)"/>
    <use class="twinkle" style="animation-delay:-2.4s" href="#spark" transform="translate(70 16) scale(0.22)"/>
  </g>
</svg>
