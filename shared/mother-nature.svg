<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Mother Nature with a crown of leaves and flowing hair, a sprig of herbs growing at her heart</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .crown { transform-box: view-box; transform-origin: 60px 54px; animation: sway 6s ease-in-out infinite; }
    .hair { animation: drift 5s ease-in-out infinite; }
    .sprout { transform-box: fill-box; transform-origin: center bottom; animation: grow 4.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes sway { 50% { transform: rotate(3deg); } }
    @keyframes drift { 50% { transform: translateX(1.5px); } }
    @keyframes grow { 50% { transform: scale(1.06, 1.1); } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
    <!-- One leaf, pointing up from its stalk at 0,0 -->
    <path id="leaf" d="M0 0C-4.5 -5 -4.5 -11 0 -16C4.5 -11 4.5 -5 0 0Z M0 -2V-13"/>
    <!-- A little five-petalled flower -->
    <g id="flower">
      <circle cx="0" cy="-3.4" r="2.2"/>
      <circle cx="3.2" cy="-1" r="2.2"/>
      <circle cx="2" cy="2.8" r="2.2"/>
      <circle cx="-2" cy="2.8" r="2.2"/>
      <circle cx="-3.2" cy="-1" r="2.2"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- Her long hair, drifting like grass in the wind -->
    <g class="hair">
      <path d="M46 44C34 54 38 76 28 92"/>
      <path d="M44 56C36 70 42 84 34 100"/>
      <path d="M74 44C86 54 82 76 92 92"/>
      <path d="M76 56C84 70 78 84 86 100"/>
      <use href="#leaf" transform="translate(28 92) rotate(-150) scale(0.55)"/>
      <use href="#leaf" transform="translate(92 92) rotate(150) scale(0.55)"/>
    </g>

    <!-- Shoulders, and the sprig of herbs growing at her heart -->
    <path d="M55 72V80M65 72V80"/>
    <path d="M38 108Q42 84 60 82Q78 84 82 108"/>
    <g class="sprout">
      <path d="M60 106V90"/>
      <path d="M60 100C53 99 49 94 49 88C56 88 60 93 60 100Z"/>
      <path d="M60 96C67 95 71 90 71 84C64 84 60 89 60 96Z"/>
    </g>

    <!-- Her face, eyes closed in a calm smile -->
    <path d="M60 34C49 34 44 44 44 54C44 66 51 74 60 74C69 74 76 66 76 54C76 44 71 34 60 34Z" fill="#12051c"/>
    <path d="M51 54Q54 56.5 57 54M63 54Q66 56.5 69 54"/>
    <path d="M57 65Q60 67 63 65"/>

    <!-- Her crown of leaves, with a flower at its heart -->
    <g class="crown">
      <use href="#leaf" transform="translate(41 43) rotate(-60)"/>
      <use href="#leaf" transform="translate(49 35.5) rotate(-30)"/>
      <use href="#leaf" transform="translate(71 35.5) rotate(30)"/>
      <use href="#leaf" transform="translate(79 43) rotate(60)"/>
      <use href="#flower" transform="translate(60 30)" fill="#12051c"/>
      <circle cx="60" cy="30" r="1.3" fill="url(#gold)" stroke="none"/>
    </g>

    <!-- The sun and moon she keeps in turn -->
    <path d="M24 16A9 9 0 0 0 24 34A11 11 0 0 1 24 16Z"/>
    <circle cx="96" cy="24" r="5"/>
    <path d="M96 14V11M96 34V37M86 24H83M106 24H109M89 17l-2-2M103 17l2-2M89 31l-2 2M103 31l2 2"/>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" style="animation-delay:-0.8s" href="#spark" transform="translate(16 62) scale(0.3)"/>
    <use class="twinkle" style="animation-delay:-2.1s" href="#spark" transform="translate(104 60) scale(0.28)"/>
    <use class="twinkle" style="animation-delay:-1.4s" href="#spark" transform="translate(22 106) scale(0.25)"/>
    <use class="twinkle" href="#spark" transform="translate(98 106) scale(0.22)"/>
  </g>
</svg>
