<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Golden banshee singing to the moon</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .hover { animation: hover 4.4s ease-in-out infinite; }
    .hair { transform-box: view-box; transform-origin: 55px 38px; animation: drift 5s ease-in-out infinite; }
    .wail { animation: wail 2.4s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes hover { 50% { transform: translateY(-2px); } }
    @keyframes drift { 50% { transform: rotate(4deg); } }
    @keyframes wail { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- The moon she sings to -->
    <path d="M94 15A10 10 0 1 0 94 35A8 8 0 1 1 94 15Z"/>

    <g class="hover">
      <!-- Long hair streaming behind her in the night wind -->
      <g class="hair">
        <path d="M55 33C48 27 40 28 31 25"/>
        <path d="M53 36C45 34 37 40 25 38"/>
        <path d="M53 40C45 42 38 50 27 51"/>
        <path d="M54 44C47 50 42 58 31 63"/>
        <path d="M38 27Q33 31 27 30" stroke-dasharray="1 2.5"/>
        <path d="M40 46Q34 49 30 46" stroke-dasharray="1 2.5"/>
      </g>

      <!-- A flowing gown that fades into mist; filled so the hair passes behind her -->
      <g fill="#12051c">
        <path d="M54 48Q59.5 46 65 48C67 58 70 70 70 80C70 90 64 98 54 102Q58 96 52 95Q55 90 48 90Q52 85 45 84C50 74 52 60 54 48Z"/>
        <path d="M57.8 43H61.2V48H57.8Z"/>
        <circle cx="59" cy="38" r="6.5"/>
      </g>
      <path d="M59 56Q63 70 62 88" stroke-dasharray="1 2.5"/>

      <!-- Closed eyes and an open, singing mouth -->
      <path d="M59.6 36.6Q60.8 37.6 62 36.6"/>
      <ellipse cx="62" cy="41" rx="0.9" ry="1.3"/>

      <!-- One arm reaching out, its sleeve hanging like a veil -->
      <path d="M65 50C72 55 78 57 86 55"/>
      <path d="M66 55C71 62 77 64 84 61"/>
      <path d="M84 61Q86 58 86 55"/>

      <!-- The trailing wisps of her gown -->
      <path d="M54 102C46 106 38 104 32 98" stroke-dasharray="1 3"/>
      <path d="M45 84C38 84 33 80 29 74" stroke-dasharray="1 3"/>

      <!-- Her keening song, rippling out toward the moon -->
      <path class="wail" d="M69 38Q71 41.5 69 45"/>
      <path class="wail" style="animation-delay:-0.4s" d="M73 35.5Q76 41.5 73 47.5"/>
      <path class="wail" style="animation-delay:-0.8s" d="M77 33Q81 41.5 77 50"/>
    </g>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" href="#spark" transform="translate(82 24) scale(0.3)"/>
    <use class="twinkle" style="animation-delay:-1.6s" href="#spark" transform="translate(98 52) scale(0.24)"/>
    <use class="twinkle" style="animation-delay:-2.6s" href="#spark" transform="translate(20 70) scale(0.24)"/>
    <use class="twinkle" style="animation-delay:-1.2s" href="#spark" transform="translate(104 96) scale(0.5)"/>
    <use class="twinkle" style="animation-delay:-2.4s" href="#spark" transform="translate(14 104) scale(0.4)"/>
  </g>
</svg>
