<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <title>Golden cauldron</title>
  <style>
    .ring { transform-box: view-box; transform-origin: 60px 60px; animation: turn 90s linear infinite; }
    .bubble { animation: rise 4.2s ease-in infinite; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(6px); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-9px); }
    }
    @keyframes flicker { 50% { transform: scale(0.86, 1.1); opacity: 0.7; } }
    @keyframes twinkle { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.55" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#a47e36"/>
    </linearGradient>
    <path id="spark" d="M0 -10Q0 0 10 0Q0 0 0 10Q0 0 -10 0Q0 0 0 -10Z"/>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ring" cx="60" cy="60" r="55" stroke-dasharray="1 4"/>

    <!-- Steam curling up from the brew -->
    <path d="M47 42q-5 -5 0 -10q5 -5 0 -10" stroke-dasharray="1 3"/>
    <path d="M73 42q5 -5 0 -10q-5 -5 0 -10" stroke-dasharray="1 3"/>

    <!-- Bubbles leaving the surface -->
    <circle class="bubble" cx="54" cy="40" r="2.3"/>
    <circle class="bubble" style="animation-delay:-1.4s" cx="66" cy="39" r="1.7"/>
    <circle class="bubble" style="animation-delay:-2.8s" cx="60" cy="33" r="1.2"/>

    <!-- The pot: rim, brew, belly, ring handles and three short legs -->
    <path d="M34 52C22 62 25 83 43 91H77C95 83 98 62 86 52"/>
    <ellipse cx="60" cy="49" rx="28" ry="5.5"/>
    <ellipse cx="60" cy="49.6" rx="23" ry="3.2" stroke-dasharray="1 2.5"/>
    <circle cx="27" cy="57" r="4"/>
    <circle cx="93" cy="57" r="4"/>
    <path d="M47 91L43 98M73 91L77 98M60 91V95"/>

    <!-- Fine engraving: light along the belly and a crescent moon on the front -->
    <path d="M33 62Q31 76 44 85" stroke-dasharray="1 2.5"/>
    <path d="M87 62Q89 76 76 85" stroke-dasharray="1 2.5"/>
    <path d="M65 63.5A9.5 9.5 0 1 0 65 80.5A7.5 7.5 0 1 1 65 63.5Z"/>

    <!-- Flames beneath -->
    <path class="flame" d="M60 111C54 108 55 102 60 97C65 102 66 108 60 111Z"/>
    <path class="flame" style="animation-delay:-0.6s" d="M48 110C44 108 45 104 48 101C51 104 52 108 48 110Z"/>
    <path class="flame" style="animation-delay:-1.2s" d="M72 110C68 108 69 104 72 101C75 104 76 108 72 110Z"/>
  </g>

  <g fill="url(#gold)">
    <use class="twinkle" href="#spark" transform="translate(69 72) scale(0.34)"/>
    <use class="twinkle" style="animation-delay:-1.2s" href="#spark" transform="translate(106 10) scale(0.6)"/>
    <use class="twinkle" style="animation-delay:-2.4s" href="#spark" transform="translate(12 108) scale(0.4)"/>
  </g>
</svg>
